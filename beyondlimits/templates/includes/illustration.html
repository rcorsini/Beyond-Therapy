{# Original decorative scenes. name: hero | blocks | garden | team | gym #}
{% if name == "hero" %}
<svg class="illo illo--hero" viewBox="0 0 520 480" role="img" aria-label="Colorful play blocks, a ball and a rainbow">
    <path d="M262 22c104-8 214 52 236 160 22 110-50 250-186 280S40 420 22 300 120 32 262 22z" fill="var(--sun-soft)"/>
    <path d="M110 330a150 150 0 0 1 300 0" fill="none" stroke="var(--coral)" stroke-width="26" stroke-linecap="round"/>
    <path d="M148 330a112 112 0 0 1 224 0" fill="none" stroke="var(--sun)" stroke-width="26" stroke-linecap="round"/>
    <path d="M186 330a74 74 0 0 1 148 0" fill="none" stroke="var(--teal)" stroke-width="26" stroke-linecap="round"/>
    <path d="M224 330a36 36 0 0 1 72 0" fill="none" stroke="var(--sky)" stroke-width="26" stroke-linecap="round"/>
    <g class="illo__float illo__float--1"><circle cx="420" cy="92" r="34" fill="var(--sun)"/><g stroke="var(--sun)" stroke-width="8" stroke-linecap="round"><path d="M420 34v-14M420 164v-14M362 92h-14M492 92h-14M379 51l-10-10M471 143l-10-10M379 133l-10 10M471 41l-10 10"/></g></g>
    <g class="illo__float illo__float--2"><path d="M70 120c0-18 14-30 32-30 6-16 22-26 40-24 18 2 30 14 32 30 16 0 28 12 28 26s-12 26-28 26H98c-16 0-28-12-28-28z" fill="#fff"/></g>
    <g transform="translate(96 330)"><rect width="96" height="96" rx="16" fill="var(--grape)"/><text x="48" y="66" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="58" fill="#fff">B</text></g>
    <g transform="translate(196 350) rotate(6)"><rect width="80" height="80" rx="14" fill="var(--coral)"/><text x="40" y="56" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="48" fill="#fff">L</text></g>
    <g transform="translate(136 262) rotate(-8)"><rect width="72" height="72" rx="13" fill="var(--teal)"/><path d="M36 18l6 12 13 2-9 9 2 13-12-6-12 6 2-13-9-9 13-2z" fill="#fff"/></g>
    <g transform="translate(372 356)"><circle cx="40" cy="40" r="40" fill="var(--sky)"/><path d="M0 40h80M40 0c-18 22-18 58 0 80M40 0c18 22 18 58 0 80" fill="none" stroke="#fff" stroke-width="6"/></g>
    <g fill="var(--grape)"><path d="M56 236l4 9 10 1-8 7 2 10-8-5-8 5 2-10-8-7 10-1z"/><path d="M470 250l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></g>
    <circle cx="300" cy="80" r="8" fill="var(--coral)"/><circle cx="60" cy="380" r="10" fill="var(--sky)"/>
</svg>
{% elif name == "garden" %}
<svg class="illo" viewBox="0 0 480 400" aria-hidden="true">
    <path d="M240 20c110 0 220 70 220 180S360 390 230 384 20 320 20 200 130 20 240 20z" fill="var(--leaf-soft)"/>
    <rect x="40" y="300" width="400" height="18" rx="9" fill="var(--leaf)"/>
    <g><path d="M120 300v-90" stroke="var(--leaf)" stroke-width="8"/><circle cx="120" cy="190" r="34" fill="var(--coral)"/><circle cx="120" cy="190" r="13" fill="var(--sun)"/></g>
    <g><path d="M240 300v-140" stroke="var(--leaf)" stroke-width="8"/><path d="M240 230c-30 0-46-20-46-40 30 0 46 20 46 40zM240 260c30 0 46-20 46-40-30 0-46 20-46 40z" fill="var(--leaf)"/><circle cx="240" cy="136" r="40" fill="var(--sun)"/><circle cx="240" cy="136" r="15" fill="var(--coral)"/></g>
    <g><path d="M360 300v-70" stroke="var(--leaf)" stroke-width="8"/><circle cx="360" cy="214" r="28" fill="var(--grape)"/><circle cx="360" cy="214" r="10" fill="#fff"/></g>
    <path d="M70 90l4 9 10 1-8 7 2 10-8-5-8 5 2-10-8-7 10-1z" fill="var(--sky)"/>
</svg>
{% elif name == "team" %}
<svg class="illo" viewBox="0 0 480 400" aria-hidden="true">
    <path d="M250 24c120 6 210 90 206 190S350 386 230 380 24 300 26 196 130 18 250 24z" fill="var(--sky-soft)"/>
    <g transform="translate(240 210)">
        <g transform="rotate(0) translate(0 -110)"><circle r="46" fill="var(--coral)"/><circle cy="-8" r="16" fill="#fff"/><path d="M-24 26a24 24 0 0 1 48 0" fill="#fff"/></g>
        <g transform="rotate(120) translate(0 -110) rotate(-120)"><circle r="46" fill="var(--teal)"/><circle cy="-8" r="16" fill="#fff"/><path d="M-24 26a24 24 0 0 1 48 0" fill="#fff"/></g>
        <g transform="rotate(240) translate(0 -110) rotate(-240)"><circle r="46" fill="var(--grape)"/><circle cy="-8" r="16" fill="#fff"/><path d="M-24 26a24 24 0 0 1 48 0" fill="#fff"/></g>
        <circle r="38" fill="var(--sun)"/><path d="M0 16s-20-12-20-26a10 10 0 0 1 20-4 10 10 0 0 1 20 4c0 14-20 26-20 26z" fill="var(--coral)"/>
    </g>
</svg>
{% elif name == "gym" %}
<svg class="illo" viewBox="0 0 480 400" aria-hidden="true">
    <path d="M230 22c120-4 230 80 226 190S340 392 220 382 22 300 26 190 110 26 230 22z" fill="var(--coral-soft)"/>
    <path d="M90 120h300" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/>
    <path d="M200 120l-20 130M280 120l20 130" stroke="var(--ink)" stroke-width="5"/>
    <rect x="160" y="246" width="160" height="26" rx="13" fill="var(--teal)"/>
    <path d="M60 330c40-30 80-30 120 0s80 30 120 0 80-30 120 0" fill="none" stroke="var(--sky)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="390" cy="220" r="42" fill="var(--sun)"/><circle cx="104" cy="230" r="30" fill="var(--grape)"/>
</svg>
{% else %}
<svg class="illo" viewBox="0 0 480 400" aria-hidden="true">
    <path d="M240 20c116 0 222 76 218 186S350 388 228 382 22 302 22 196 124 20 240 20z" fill="var(--sun-soft)"/>
    <g transform="translate(110 220)"><rect width="110" height="110" rx="18" fill="var(--teal)"/><text x="55" y="76" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="64" fill="#fff">A</text></g>
    <g transform="translate(240 220)"><rect width="110" height="110" rx="18" fill="var(--coral)"/><text x="55" y="76" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="64" fill="#fff">B</text></g>
    <g transform="translate(176 104) rotate(-6)"><rect width="110" height="110" rx="18" fill="var(--grape)"/><text x="55" y="76" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="64" fill="#fff">C</text></g>
    <path d="M390 80l5 11 12 2-9 8 2 12-10-6-10 6 2-12-9-8 12-2z" fill="var(--sky)"/>
</svg>
{% endif %}
