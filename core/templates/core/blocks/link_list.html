<section class="container container--narrow block">
    <h2 class="block__title">{{ value.heading }}</h2>
    <ul class="link-list">
        {% for link in value.links %}
        <li>
            {% if link.url %}<a href="{{ link.url }}" rel="noopener">{{ link.title }}</a>{% else %}<strong>{{ link.title }}</strong>{% endif %}
            {% if link.description %}<span>{{ link.description }}</span>{% endif %}
        </li>
        {% endfor %}
    </ul>
</section>
