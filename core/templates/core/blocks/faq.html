{% load wagtailcore_tags %}
<section class="container container--narrow block">
    {% if value.heading %}<h2 class="block__title">{{ value.heading }}</h2>{% endif %}
    <div class="faq">
        {% for item in value.items %}
        <details class="faq__item">
            <summary>{{ item.question }}</summary>
            <div class="prose">{{ item.answer|richtext }}</div>
        </details>
        {% endfor %}
    </div>
</section>
